name: Deploy to Dev

# Runs on every push to main: build + bundle deploy + bundle run against dev target.
# Embeds the Git SHA so the running app exposes what's live.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: databricks/setup-cli@main

      - name: Install dependencies
        run: npm ci

      - name: Build client + server
        run: npm run build:client && npm run build:server

      # Mirrors release.yml / rollback.yml — capture the actual checked-out
      # SHA so all three workflows surface the deployed ref the same way.
      # Equivalent to `github.sha` for this workflow since there's no
      # `inputs.ref`, but kept for symmetry.
      - name: Capture deployed git ref
        id: git
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Validate bundle
        run: databricks bundle validate -t dev

      - name: Deploy bundle (resources only — Git-backed source)
        run: |
          databricks bundle deploy -t dev \
            --var="resource_name_suffix=dev" \
            --var="git_sha=${{ steps.git.outputs.sha }}" \
            --var="git_ref=${{ steps.git.outputs.ref }}"

      # `apps deploy` requires the app's compute to be RUNNING. First-time
      # deploys after `bundle deploy` come up STOPPED — `apps start` is
      # idempotent (no-op if already running) and blocks until ACTIVE.
      - name: Ensure app compute is running
        run: databricks apps start db-chatbot-dev

      # Git-backed: the platform pulls source from the configured Git repo at
      # the commit we just merged. `--json` overrides the default branch ref
      # in databricks.yml so each push deploys exactly that commit.
      - name: Deploy app from Git (commit = HEAD)
        run: |
          databricks apps deploy db-chatbot-dev \
            --json "$(printf '{"git_source":{"commit":"%s"}}' "${{ steps.git.outputs.sha }}")"
