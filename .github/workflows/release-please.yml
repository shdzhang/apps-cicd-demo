name: Release Please

# Auto-bump version + open a release PR per merge to main, based on
# Conventional Commits in the commit history. Merging the release PR
# creates the Git tag, which triggers `release.yml` to deploy.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
